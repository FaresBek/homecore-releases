name: Publish verified signed HomeCore APK

on:
  push:
    branches: [main]
    paths: ["release/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: homecore-production-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify production package, manifest and signing certificate
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import hashlib, json, os, re, subprocess
          from pathlib import Path
          manifest = json.loads(Path('release/homecore-release.json').read_text())
          version = manifest['version_name']
          assert re.fullmatch(r'\d+\.\d+\.\d+', version)
          assert manifest['schema'] == 1 and manifest['package_name'] == 'app.homecore'
          assert type(manifest['version_code']) is int and manifest['version_code'] > 0
          assert manifest['apk_asset'] == f'homecore-{version}-release.apk'
          assert manifest['source_repository'] == 'FaresBek/stips-panel'
          assert re.fullmatch(r'[0-9a-f]{40}', manifest['source_commit'])
          apk = Path('release') / manifest['apk_asset']
          assert apk.stat().st_size == manifest['size_bytes']
          assert hashlib.sha256(apk.read_bytes()).hexdigest() == manifest['sha256']
          build_tools = sorted((Path(os.environ['ANDROID_HOME']) / 'build-tools').iterdir(), key=lambda p: tuple(int(v) for v in re.findall(r'\d+', p.name)))[-1]
          badge = subprocess.check_output([str(build_tools/'aapt2'), 'dump', 'badging', str(apk)], text=True)
          expected = f"name='app.homecore' versionCode='{manifest['version_code']}' versionName='{version}'"
          assert expected in badge and 'application-debuggable' not in badge
          certs = subprocess.check_output([str(build_tools/'apksigner'), 'verify', '--print-certs', str(apk)], text=True)
          digests = re.findall(r'certificate SHA-256 digest:\s*([0-9a-fA-F]{64})', certs)
          assert digests and {cert.lower() for cert in digests} == {'6a73e57fcf3c3ac46a4814a3f711c888e0966114af6f2b5d5aa966cc5b208325'}, 'Unexpected production signer'
          subprocess.run([str(build_tools/'zipalign'), '-c', '-P', '16', '4', str(apk)], check=True)
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write(f'RELEASE_VERSION={version}\nAPK_PATH={apk}\n')
          print(f'Verified HomeCore {version}, code {manifest["version_code"]}, hash and pinned production signer.')
          PYCODE
      - name: Publish immutable versioned assets
        shell: bash
        run: |
          TAG="v$RELEASE_VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft >/tmp/current-release.json 2>/dev/null; then
            python3 -c 'import json; assert json.load(open("/tmp/current-release.json"))["isDraft"], "This version is already public; increase the version instead of replacing it."'
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "HomeCore $RELEASE_VERSION" --notes-file release/notes.md --draft
          fi
          if gh api "repos/$GITHUB_REPOSITORY/releases/latest" >/tmp/latest-release.json 2>/dev/null; then
            PREVIOUS_TAG=$(python3 -c 'import json; print(json.load(open("/tmp/latest-release.json"))["tag_name"])')
            gh release download "$PREVIOUS_TAG" --repo "$GITHUB_REPOSITORY" --pattern homecore-release.json --dir /tmp/previous-homecore
            python3 - <<'PYCODE'
          import json
          current = json.load(open('release/homecore-release.json'))
          previous = json.load(open('/tmp/previous-homecore/homecore-release.json'))
          assert current['version_code'] > previous['version_code'], 'Android version code must increase'
          assert tuple(map(int, current['version_name'].split('.'))) > tuple(map(int, previous['version_name'].split('.'))), 'Release version must increase'
          PYCODE
          fi
          gh release upload "$TAG" "$APK_PATH" release/homecore-release.json --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "HomeCore $RELEASE_VERSION" \
            --notes-file release/notes.md --draft=false --latest
